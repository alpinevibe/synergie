# ============================================================================
#  synergie.alpinevibe.fr — application « Synergie »
#  Le service n'écoute que sur 127.0.0.1:8077 ; ce vhost est le seul chemin
#  depuis l'extérieur.
#  Fichier posé par ~/synergie/deploy/installer.sh — ne pas éditer à la main.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name synergie.alpinevibe.fr;

    include /etc/nginx/snippets/alpinevibe-securite.conf;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name synergie.alpinevibe.fr;

    ssl_certificate     /etc/letsencrypt/live/synergie.alpinevibe.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synergie.alpinevibe.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    include /etc/nginx/snippets/alpinevibe-securite.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Temps réel (le tableau blanc se met à jour tout seul) : les réponses du flux
        # d'événements ne doivent PAS être mises en tampon, sinon rien n'arrive.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 900s;
        client_max_body_size 45m;
    }
}
